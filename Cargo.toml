[package]
name = "nvtop"
version = "0.1.3"
edition = "2024"
description = """ nvtop: An NVIDIA SMI'esk GPU Monitoring tool for your terminal. """
keywords = ["Real-time monitoring", "GPU", "NVIDIA", "nvml", "nvidia-smi", "Command-line tool"]
authors = ["jer, alphastrata@gmail.com", "camuward, cameronuward@gmail.com"]
documentation = "https://www.github.com/alphastrata/nvtop-rust"
license = "MIT"
homepage = "https://www.jeremyfwebb.ninja"

[dependencies]
anyhow = "1.0.100"
argh = "0.1.12"
crossterm = "0.29.0"
nvml-wrapper = "0.12.1"
ratatui = "0.30.0"
skim = "0.10.4"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flume = "0.12.0"

[[bin]]
name = "nvtop"
path = "src/main.rs"

[workspace]
